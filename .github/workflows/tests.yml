name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
